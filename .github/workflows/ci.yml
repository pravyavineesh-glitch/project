name: Python CI Pipeline

# When should the workflow run?
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# What tasks should GitHub perform?
jobs:
  build:
    name: Python Test Job

    # GitHub provides an Ubuntu machine
    runs-on: ubuntu-latest

    steps:

      # Step 1: Get source code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install pytest
      - name: Install dependencies
        run: pip install pytest

      # Step 4: Check Python syntax
      - name: Check syntax
        run: python -m py_compile app.py test_app.py

      # Step 5: Run automated tests
      - name: Run tests
        run: pytest -v

      # Step 6: Run application
      - name: Run application
        run: python app.py

